<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TSS社内ポータル</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TSSポータル">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- OneSignal SDK の読み込み -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    const currentPath = window.location.pathname.replace(/\/[^\/]*$/, '/');

    // ★GASの受信窓口URL（認証リダイレクトを避けるため標準の /macros/s/... エンドポイントを使用）
    const GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbywoTJGglKIMRd0UCYhECGQRnopD5lLb_oSfE1OhbKnwJNA4f4vbP7_LHhxFi9ANUd7-A/exec";

    // =========================================================
    // 1. Service Worker（バックグラウンド着信検知）と社員IDを共有するためのIndexedDB保存関数
    // =========================================================
    function syncEmpIdToIndexedDB(empId) {
      if (!empId || !window.indexedDB) return;
      try {
        const req = indexedDB.open("tss_portal_push_db", 1);
        req.onupgradeneeded = function(e) {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("kv")) {
            db.createObjectStore("kv");
          }
        };
        req.onsuccess = function(e) {
          const db = e.target.result;
          const tx = db.transaction("kv", "readwrite");
          tx.objectStore("kv").put(String(empId).trim(), "tss_emp_id");
        };
      } catch (e) {}
    }

    // =========================================================
    // 2. ログイン前に「通知タップ（OPENED）」「端末着信（RECEIVED）」をGASへ送信する関数
    // =========================================================
    function sendPushTrackBeforeLogin(eventType, anpiId) {
      try {
        const empId = localStorage.getItem("tss_emp_id");
        if (!empId) return;

        // 短時間の重複送信を防止（1分間に1回まで）
        const nowMin = Math.floor(Date.now() / 60000);
        const dedupKey = `TSS_TRACK_${eventType}_${anpiId || 'ACTIVE'}_${nowMin}`;
        if (sessionStorage.getItem(dedupKey)) return;
        sessionStorage.setItem(dedupKey, "1");

        const payload = JSON.stringify({
          action: "ANPI_PUSH_TRACK",
          userId: String(empId).trim(),
          eventType: eventType, // "OPENED" または "RECEIVED"
          anpiId: anpiId || ""
        });

        fetch(GAS_WEBHOOK_URL, {
          method: "POST",
          mode: "no-cors",
          keepalive: true,
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload
        }).catch(function() {});
      } catch (e) {}
    }

    // 起動時：すでに保存されている社員IDがあればIndexedDBへ同期し、ログイン前起動（通知タップ）を記録
    window.addEventListener("DOMContentLoaded", function() {
      const savedEmpId = localStorage.getItem("tss_emp_id");
      if (savedEmpId) {
        syncEmpIdToIndexedDB(savedEmpId);
        const params = new URLSearchParams(window.location.search);
        const anpiId = params.get("anpiId") || "";
        // アプリ（ログイン画面）が開かれた瞬間に、ログイン前アクセスとしてGASへ通知
        sendPushTrackBeforeLogin("OPENED", anpiId);
      }
    });

    // アプリがバックグラウンドから前面に切り替わった瞬間（通知タップでの復帰時）にも記録
    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === "visible") {
        const params = new URLSearchParams(window.location.search);
        sendPushTrackBeforeLogin("OPENED", params.get("anpiId") || "");
      }
    });

    // =========================================================
    // 3. OneSignal 初期化 ＆ イベント監視
    // =========================================================
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "961fa089-fa82-41eb-bc31-348eaabd4bad",
          serviceWorkerPath: currentPath.replace(/^\//, '') + "OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: currentPath },
          notifyButton: {
            enable: false
          }
        });

        checkAndShowPromptBar(OneSignal);

        const savedEmpId = localStorage.getItem("tss_emp_id");
        if (savedEmpId) {
          syncEmpIdToIndexedDB(savedEmpId);
          await OneSignal.login(savedEmpId);
        }

        // 通知バナーがクリック（タップ）された瞬間
        OneSignal.Notifications.addEventListener("click", function(event) {
          const data = (event && event.notification && event.notification.additionalData) || {};
          sendPushTrackBeforeLogin("OPENED", data.anpiId || "");
        });

        // アプリを開いている状態で通知が着信した瞬間
        OneSignal.Notifications.addEventListener("foregroundWillDisplay", function(event) {
          const data = (event && event.notification && event.notification.additionalData) || {};
          sendPushTrackBeforeLogin("RECEIVED", data.anpiId || "");
        });

        OneSignal.User.PushSubscription.addEventListener("change", async function(event) {
          checkAndShowPromptBar(OneSignal);
          const empId = localStorage.getItem("tss_emp_id");
          if (event.current.optedIn && empId) {
            syncEmpIdToIndexedDB(empId);
            await OneSignal.login(empId);
          }
        });
      } catch (err) {
        console.error("OneSignal初期化エラー:", err);
      }
    });

    function checkAndShowPromptBar(OneSignal) {
      const isOptedIn = OneSignal.User.PushSubscription.optedIn;
      const subId = OneSignal.User.PushSubscription.id;
      const bar = document.getElementById("os-debug-bar");

      if (isOptedIn && subId) {
        if (bar && bar.style.display !== "none") {
          showPromptBar("✅ 通知の設定が完了しました！", "#16a34a", true);
        }
        return;
      }

      if (localStorage.getItem("tss_hide_push_bar") === "1") {
        if (bar) bar.style.display = "none";
        return;
      }

      showPromptBar("🔔 ここをタップして通知を「許可」してください", "#d97706", false);
    }

    function showPromptBar(text, bgColor, autoHide) {
      let bar = document.getElementById("os-debug-bar");
      if (!bar) {
        bar = document.createElement("div");
        bar.id = "os-debug-bar";
        bar.style.cssText = "position:fixed; top:8px; left:8px; z-index:99999; color:#fff; font-size:13px; font-weight:bold; padding:8px 12px; border-radius:6px; box-shadow:0 3px 8px rgba(0,0,0,0.3); display:flex; align-items:center; gap:10px; transition: opacity 0.4s;";

        const textSpan = document.createElement("span");
        textSpan.id = "os-debug-text";
        textSpan.style.cursor = "pointer";
        textSpan.onclick = function() {
          OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.Notifications.requestPermission();
            await OneSignal.User.PushSubscription.optIn();
            const empId = localStorage.getItem("tss_emp_id");
            if (empId) {
              syncEmpIdToIndexedDB(empId);
              await OneSignal.login(empId);
            }
            checkAndShowPromptBar(OneSignal);
          });
        };

        const closeBtn = document.createElement("span");
        closeBtn.innerText = "✕";
        closeBtn.title = "この端末では表示しない";
        closeBtn.style.cssText = "cursor:pointer; padding:0 4px; font-size:15px; opacity:0.85; border-left:1px solid rgba(255,255,255,0.4); padding-left:10px;";
        closeBtn.onclick = function(e) {
          e.stopPropagation();
          localStorage.setItem("tss_hide_push_bar", "1");
          bar.style.display = "none";
        };

        bar.appendChild(textSpan);
        bar.appendChild(closeBtn);
        document.body.appendChild(bar);
      }

      bar.style.opacity = "1";
      bar.style.display = "flex";
      bar.style.backgroundColor = bgColor;
      document.getElementById("os-debug-text").innerText = text;

      if (autoHide) {
        setTimeout(() => {
          bar.style.opacity = "0";
          setTimeout(() => { bar.style.display = "none"; }, 400);
        }, 2000);
      }
    }

    // GASからの合図（ログイン・ログアウト）を受け取る処理
    window.addEventListener("message", function(event) {
      if (!event.data) return;

      if (event.data.type === "TSS_LOGIN" && event.data.userId) {
        const empId = String(event.data.userId).trim();
        localStorage.setItem("tss_emp_id", empId);
        syncEmpIdToIndexedDB(empId);
        OneSignalDeferred.push(async function(OneSignal) {
          await OneSignal.login(empId);
        });
      }

      if (event.data.type === "TSS_LOGOUT") {
        window.location.reload();
      }
    });
  </script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f4f6; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/a/macros/toyosogo-portal.com/s/AKfycbywoTJGglKIMRd0UCYhECGQRnopD5lLb_oSfE1OhbKnwJNA4f4vbP7_LHhxFi9ANUd7-A/exec" allow="geolocation; clipboard-write"></iframe>
</body>
</html>
