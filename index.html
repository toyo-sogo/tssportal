<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TSS社内ポータル</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TSSポータル">
  <link rel="apple-touch-icon" href="./icon-192.png">

 
  <!-- OneSignal SDK の読み込み -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    const currentPath = window.location.pathname.replace(/\/[^\/]*$/, '/');

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "961fa089-fa82-41eb-bc31-348eaabd4bad",
          serviceWorkerPath: currentPath.replace(/^\//, '') + "OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: currentPath },
          // ★修正：右下のベルマークも非表示にして、オレンジのバーに完全一本化
          notifyButton: {
            enable: false
          }
        });

        // 現在の登録状態をチェックしてオレンジのバーを表示するか判定
        checkAndShowPromptBar(OneSignal);

        // すでにログイン済みの社員IDが保存されていれば再紐付け
        const savedEmpId = localStorage.getItem("tss_emp_id");
        if (savedEmpId) {
          await OneSignal.login(savedEmpId);
        }

        // 通知状態が変化した瞬間の処理
        OneSignal.User.PushSubscription.addEventListener("change", async function(event) {
          checkAndShowPromptBar(OneSignal);
          const empId = localStorage.getItem("tss_emp_id");
          if (event.current.optedIn && empId) {
            await OneSignal.login(empId);
          }
        });
      } catch (err) {
        console.error("OneSignal初期化エラー:", err);
      }
    });

    // 未登録の時だけバーを出し、登録済みの人や「✕」で閉じた人には出さない
    function checkAndShowPromptBar(OneSignal) {
      const isOptedIn = OneSignal.User.PushSubscription.optedIn;
      const subId = OneSignal.User.PushSubscription.id;
      const bar = document.getElementById("os-debug-bar");

      // すでに通知登録が完了している場合
      if (isOptedIn && subId) {
        if (bar && bar.style.display !== "none") {
          showPromptBar("✅ 通知の設定が完了しました！", "#16a34a", true);
        }
        return;
      }

      // この端末（PC等）で過去に「✕」ボタンを押して閉じたことがある場合は表示しない
      if (localStorage.getItem("tss_hide_push_bar") === "1") {
        if (bar) bar.style.display = "none";
        return;
      }

      // まだ通知が未登録の場合のみオレンジのバーを表示
      showPromptBar("🔔 ここをタップして通知を「許可」してください", "#d97706", false);
    }

    function showPromptBar(text, bgColor, autoHide) {
      let bar = document.getElementById("os-debug-bar");
      if (!bar) {
        bar = document.createElement("div");
        bar.id = "os-debug-bar";
        bar.style.cssText = "position:fixed; top:8px; left:8px; z-index:99999; color:#fff; font-size:13px; font-weight:bold; padding:8px 12px; border-radius:6px; box-shadow:0 3px 8px rgba(0,0,0,0.3); display:flex; align-items:center; gap:10px; transition: opacity 0.4s;";

        // メッセージ部分（タップでブラウザ本体の許可＋OneSignal購読ONを一発実行）
        const textSpan = document.createElement("span");
        textSpan.id = "os-debug-text";
        textSpan.style.cursor = "pointer";
        textSpan.onclick = function() {
          OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.Notifications.requestPermission();
            await OneSignal.User.PushSubscription.optIn();
            const empId = localStorage.getItem("tss_emp_id");
            if (empId) await OneSignal.login(empId);
            checkAndShowPromptBar(OneSignal);
          });
        };

        // 閉じる「✕」ボタン（PCなどで通知不要な場合に消せるようにする）
        const closeBtn = document.createElement("span");
        closeBtn.innerText = "✕";
        closeBtn.title = "この端末では表示しない";
        closeBtn.style.cssText = "cursor:pointer; padding:0 4px; font-size:15px; opacity:0.85; border-left:1px solid rgba(255,255,255,0.4); padding-left:10px;";
        closeBtn.onclick = function(e) {
          e.stopPropagation();
          localStorage.setItem("tss_hide_push_bar", "1");
          bar.style.display = "none";
        };

        bar.appendChild(textSpan);
        bar.appendChild(closeBtn);
        document.body.appendChild(bar);
      }

      bar.style.opacity = "1";
      bar.style.display = "flex";
      bar.style.backgroundColor = bgColor;
      document.getElementById("os-debug-text").innerText = text;

      if (autoHide) {
        setTimeout(() => {
          bar.style.opacity = "0";
          setTimeout(() => { bar.style.display = "none"; }, 400);
        }, 2000);
      }
    }

    // GASからの合図（ログイン・ログアウト）を受け取る処理
    window.addEventListener("message", function(event) {
      if (!event.data) return;

      if (event.data.type === "TSS_LOGIN" && event.data.userId) {
        const empId = String(event.data.userId).trim();
        localStorage.setItem("tss_emp_id", empId);
        OneSignalDeferred.push(async function(OneSignal) {
          await OneSignal.login(empId);
        });
      }

      if (event.data.type === "TSS_LOGOUT") {
        window.location.reload();
      }
    });
  </script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f4f6; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbyaEMsugWQC69XtCie39No5CD6ccDrTB35urMxMbspSmDhgR39VqfTPnA--cfo8Ne_V/exec" allow="geolocation; clipboard-write"></iframe>
</body>
</html>
