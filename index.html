<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TSS社内ポータル</title>
  <!-- PWA用の設定ファイル読み込み -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TSSポータル">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- OneSignal SDK の読み込み -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "961fa089-fa82-41eb-bc31-348eaabd4bad",
        notifyButton: { enable: true } // 画面右下に通知許可のベルマークを表示
      });
    });

    // ★GASポータル側から「ログイン成功した社員ID」を受け取ってスマホと紐付ける処理
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "TSS_LOGIN" && event.data.userId) {
        const empId = String(event.data.userId).trim();
        OneSignalDeferred.push(async function(OneSignal) {
          // 社員IDをOneSignalの「External ID」として登録
          await OneSignal.login(empId);
          // 通知許可ポップアップを表示
          await OneSignal.Slidedown.promptPush();
        });
      }
    });
  </script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f4f6; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbyaEMsugWQC69XtCie39No5CD6ccDrTB35urMxMbspSmDhgR39VqfTPnA--cfo8Ne_V/exec" allow="geolocation; clipboard-write"></iframe>
</body>
</html>
