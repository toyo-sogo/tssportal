<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TSS社内ポータル</title>
  <!-- PWA用の設定ファイル読み込み -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TSS社内ポータル">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- OneSignal SDK の読み込み -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "961fa089-fa82-41eb-bc31-348eaabd4bad",
        // ▼ 右下のベルマークの日本語化
        notifyButton: {
          enable: true,
          text: {
            'tip.state.unsubscribed': '通知を受け取る',
            'tip.state.subscribed': '通知は有効です',
            'tip.state.blocked': '通知がブロックされています',
            'message.prenotify': 'タップして通知を受け取る',
            'message.action.subscribed': '通知設定が完了しました！',
            'message.action.resubscribed': '通知の受信を再開しました',
            'message.action.unsubscribed': '通知をオフにしました',
            'dialog.main.title': 'TSS社内ポータル通知設定',
            'dialog.main.button.subscribe': '通知をオンにする',
            'dialog.main.button.unsubscribe': '通知をオフにする',
            'dialog.blocked.title': '通知のブロック解除',
            'dialog.blocked.message': 'ブラウザの設定から通知を許可してください。'
          }
        },
        // ▼ 通知確認ポップアップの日本語化
        promptOptions: {
          slidedown: {
            prompts: [
              {
                type: "push",
                autoPrompt: true, // ログイン前に勝手に出ないようにする
                text: {
                  actionMessage: "TSS社内ポータルからの新着お知らせを受け取りますか？",
                  acceptButton: "許可する",
                  cancelButton: "あとで"
                }
              }
            ]
          }
        }
      });
    });

    // ★GASポータル側から「ログイン成功した社員ID」を受け取ってスマホと紐付ける処理
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "TSS_LOGIN" && event.data.userId) {
        const empId = String(event.data.userId).trim();
        OneSignalDeferred.push(async function(OneSignal) {
          // 社員IDをOneSignalに登録
          await OneSignal.login(empId);
          // ログイン成功後に日本語の確認画面を表示
          await OneSignal.Slidedown.promptPush();
        });
      }
    });
  </script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f4f6; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbyaEMsugWQC69XtCie39No5CD6ccDrTB35urMxMbspSmDhgR39VqfTPnA--cfo8Ne_V/exec" allow="geolocation; clipboard-write"></iframe>
</body>
</html>
